<title>This page has moved</title>
<script>
  // Sites that moved off andrewcoul.github.io. Keep the path, query, and hash
  // so password-reset and email links still land on the right page.
  var moves = {
    "/ca-log": "https://integrity-structural.github.io/ca-log",
    // The tracker serves from the root of its Worker, so drop the prefix.
    "/project-tracker": "https://integrity-tracker.acoulson4646.workers.dev"
  };
  for (var prefix in moves) {
    var path = location.pathname;
    if (path === prefix || path.indexOf(prefix + "/") === 0) {
      location.replace(moves[prefix] + (path.slice(prefix.length) || "/") + location.search + location.hash);
    }
  }
</script>
</head>
